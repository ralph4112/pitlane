services:
  - type: web
    name: pitlane-garage
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:setup && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pitlane-postgres
          property: connectionString

databases:
  - name: pitlane-postgres
    databaseName: pitlane
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    ipAllowList: []
